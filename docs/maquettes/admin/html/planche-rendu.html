<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>

<h1>Nouvelle admin · le rendu réel</h1>
<p class="lead">Captures de l’admin codée, sur un serveur de test (données inventées). Sobre en mode clair, Cockpit en mode sombre : l’admin suit le réglage de l’appareil.</p>
<div class="row">
<figure><img class="shot" src="../rendu-light-pc-1-accueil.png" width="1000" height="625"><figcaption class="cap">PC · Vue d’ensemble (Sobre)<small>« À traiter » d’abord : chaque point a son bouton.</small></figcaption></figure>

</div>
