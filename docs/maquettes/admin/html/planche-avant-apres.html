<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#E9EBEF;color:#18181B;padding:44px;width:2080px}
h1{font-size:46px;font-weight:800;letter-spacing:-1px}
.lead{font-size:19px;color:#3F3F46;margin:8px 0 26px;max-width:1500px;line-height:1.45}
.shot{display:block;border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08)}
.ph{border-radius:24px}
figure{margin:0}
.cap{font-size:15px;color:#3F3F46;margin-top:10px;font-weight:600}
.cap small{display:block;font-weight:400;color:#71717A;margin-top:2px;font-size:14px}
.row{display:flex;gap:32px;align-items:flex-start;margin-bottom:34px}
ul.ux{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45;width:560px}
ul.ux li{padding-left:24px;position:relative}
ul.ux li::before{content:'';position:absolute;left:0;top:7px;width:11px;height:11px;border-radius:3px;background:#00A651}
ul.ux b{font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#FFF1D6;color:#9A5B00;vertical-align:2px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:34px}
.lab{font-size:22px;font-weight:800;margin-bottom:12px}.lab.after{color:#00843F}
.pair{display:flex;gap:28px;align-items:flex-start}</style></head><body>
<h1>L’admin aujourd’hui et demain</h1><p class="lead">À gauche, les captures des tests d’aujourd’hui ; à droite, la nouvelle admin (direction Sobre) avec le même genre de contenu.</p>
<div class="vs">
  <div><div class="lab">Aujourd’hui</div><figure><img class="shot " src="../avant-pc-tableau-de-bord.png" width="1000" height="672" alt=""><figcaption class="cap">Tableau de bord<small>Gros chiffres sans contexte, raccourcis sur toute une ligne, rien ne dit ce qui demande une action.</small></figcaption></figure></div>
  <div><div class="lab after">Demain</div><figure><img class="shot " src="../sobre-pc-1-accueil.png" width="1000" height="625" alt=""><figcaption class="cap">Vue d’ensemble<small>« À traiter » en premier, chiffres avec leur tendance, journal à côté.</small></figcaption></figure></div>
</div>
<div class="vs">
  <div><div class="lab">Aujourd’hui</div><figure><img class="shot " src="../avant-pc-compte.png" width="1000" height="672" alt=""><figcaption class="cap">Fiche d’un compte<small>6 boutons de même poids, « Supprimer » à côté de « Modifier », la liste est sur une autre page.</small></figcaption></figure></div>
  <div><div class="lab after">Demain</div><figure><img class="shot " src="../sobre-pc-2-comptes.png" width="1000" height="625" alt=""><figcaption class="cap">Comptes + fiche<small>La fiche s’ouvre à droite de la liste ; le blocage et son bouton en tête ; supprimer à part.</small></figcaption></figure></div>
</div>
<div class="pair">
  <div><div class="lab">Aujourd’hui</div><figure><img class="shot ph" src="../avant-tel-coupons.png" width="390" height="844" alt=""><figcaption class="cap">Téléphone · Coupons<small>Un coupon = un écran ; menu qui défile.</small></figcaption></figure></div>
  <div><div class="lab after">Demain</div><figure><img class="shot ph" src="../sobre-tel-3-coupons.png" width="390" height="844" alt=""><figcaption class="cap">Téléphone · Coupons<small>6 coupons sur un écran ; barre du bas.</small></figcaption></figure></div>
  <div><div class="lab">&nbsp;</div><figure><img class="shot ph" src="../sobre-tel-1-accueil.png" width="390" height="844" alt=""><figcaption class="cap">Téléphone · Vue d’ensemble<small>Ce qui demande une action, puis les chiffres.</small></figcaption></figure></div>
  <div><div class="lab">&nbsp;</div><figure><img class="shot ph" src="../cockpit-tel-2-comptes.png" width="390" height="844" alt=""><figcaption class="cap">Téléphone · Comptes (Cockpit)<small>La même page, direction sombre.</small></figcaption></figure></div>
</div>
</body></html>
